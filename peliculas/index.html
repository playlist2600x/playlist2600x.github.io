<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo de películas y series</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:700,400&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', Arial, sans-serif;
      background: linear-gradient(120deg, #1e3c72 0%, #2a5298 100%);
      margin: 0;
      min-height: 100vh;
      color: #f1f3fa;
    }
    .container {
      max-width: 1000px;
      margin: 40px auto 0 auto;
      background: rgba(35, 45, 70, 0.93);
      border-radius: 22px;
      box-shadow: 0 6px 48px 0 #00153055, 0 1.5px 5px #22334433;
      padding: 2.6rem 2rem 2rem 2rem;
      position: relative;
      overflow: hidden;
    }
    h1 {
      text-align: center;
      font-weight: 700;
      font-size: 2.4rem;
      letter-spacing: 1.5px;
      margin-bottom: 1.4rem;
      color: #ffe477;
      text-shadow: 0 2px 12px #2229, 0 1px 0 #333;
    }
    .table-wrapper {
      overflow-x: auto;
      width: 100%;
      margin-top: 1.2rem;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      box-shadow: 0 1px 8px #0002;
    }
    table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      min-width: 410px;
      background: transparent;
    }
    th, td {
      padding: 0.7em 1em;
      text-align: left;
      font-size: 1.06em;
      border-bottom: 1px solid #2d425d;
      transition: background 0.2s;
    }
    th {
      background: rgba(80,110,180,0.13);
      color: #ffe477;
      font-weight: 700;
      border-bottom: 2.5px solid #9ad7ff44;
      letter-spacing: 0.05em;
      font-size: 1.13em;
    }
    tr:hover {
      background: rgba(70, 120, 255, 0.16);
      color: #fff;
      transition: background 0.3s, color 0.25s;
    }
    #search {
      width: 100%;
      padding: 0.9em;
      margin-top: 1.2em;
      margin-bottom: 0.5em;
      border: 1.5px solid #477ed1;
      border-radius: 12px;
      background: rgba(255,255,255,0.11);
      color: #222;
      font-size: 1.12em;
      outline: none;
      box-shadow: 0 1.5px 12px #0e183555;
      transition: border 0.18s;
    }
    #search:focus {
      border: 2.5px solid #ffe477;
      background: #fff;
      color: #1e3450;
    }
    .pagination {
      margin-top: 1.7em;
      text-align: center;
      user-select: none;
    }
    .pagination button {
      margin: 0 4px;
      padding: 0.52em 1.19em;
      font-size: 1.05em;
      border-radius: 8px;
      border: 1.5px solid #517eff88;
      background: linear-gradient(90deg, #4666e7 50%, #2f375a 100%);
      color: #ffe477;
      cursor: pointer;
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 600;
      box-shadow: 0 1px 6px #33447718;
      transition: background 0.19s, color 0.19s, border 0.17s;
    }
    .pagination button.active, .pagination button:focus {
      background: linear-gradient(90deg, #ffe477 60%, #ffba15 100%);
      color: #2d3240;
      border-color: #ffe477;
    }
    .pagination button:disabled {
      color: #999;
      border-color: #eee;
      background: #ddd;
      cursor: not-allowed;
    }
    ::selection { background: #ffe47777; }
    @media (max-width: 700px) {
      .container { padding: 1em 0.3em; }
      h1 { font-size: 1.35rem; }
      #search { font-size: 1em; }
      th, td { padding: 0.4em 0.3em; font-size: 0.96em; }
      .pagination button { font-size: 0.92em; }
      table { min-width: 350px; }
    }
    @media (max-width: 600px) {
      .container { padding: 0.5em 0; }
      h1 { font-size: 1.05rem; }
      #search { font-size: 0.99em; padding: 0.75em 0.4em; }
      th, td { padding: 0.23em 0.3em; font-size: 0.83em; }
      .pagination button { font-size: 0.89em; padding: 0.42em 0.7em; }
      table { min-width: 320px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Catálogo de películas y series</h1>
    <input id="search" type="text" placeholder="Buscar por título o disco...">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Título</th>
            <th>Disco</th>
          </tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>
  <script>
    const PAGE_SIZE = 50;
    let peliculas = [];
    let currentPage = 1;
    let filtered = [];

    fetch('peliculas.json')
      .then(res => res.json())
      .then(data => {
        peliculas = data;
        filtered = peliculas;
        renderTable();
        renderPagination();
      });

    document.getElementById('search').addEventListener('input', function() {
      const q = this.value.toLowerCase();
      filtered = peliculas.filter(item =>
        item.titulo.toLowerCase().includes(q) ||
        item.disco.toLowerCase().includes(q)
      );
      currentPage = 1;
      renderTable();
      renderPagination();
    });

    function renderTable() {
      const start = (currentPage - 1) * PAGE_SIZE;
      const end = start + PAGE_SIZE;
      const rows = filtered.slice(start, end).map((item, i) => `
        <tr>
          <td>${start + i + 1}</td>
          <td>${highlightSearch(item.titulo)}</td>
          <td>${highlightSearch(item.disco)}</td>
        </tr>
      `).join('');
      document.getElementById('tabla').innerHTML = rows || '<tr><td colspan="3">Sin resultados.</td></tr>';
    }

    function renderPagination() {
      const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
      const pagDiv = document.getElementById('pagination');
      pagDiv.innerHTML = '';
      if (totalPages <= 1) return;
      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        if (i === currentPage) btn.className = 'active';
        btn.onclick = () => { currentPage = i; renderTable(); renderPagination(); };
        pagDiv.appendChild(btn);
      }
    }

    // Resalta la búsqueda
    function highlightSearch(text) {
      const q = document.getElementById('search').value.trim();
      if (!q) return text;
      const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'ig');
      return text.replace(re, '<span style="background:#ffe477;color:#253055;border-radius:4px;padding:0 2px;">$1</span>');
    }
  </script>
</body>
</html>
